[project]
name = "funbox-tools"
version = "0.1.0"
description = "Developer tooling for the FunBox FPGA flow"
requires-python = ">=3.11"
dependencies = ["rich>=13.9"]

[dependency-groups]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "C90", "N", "RET", "RUF", "PIE", "PERF",]

[tool.ruff.format]
quote-style = "double"
